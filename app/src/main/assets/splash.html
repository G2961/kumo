<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>kumo</title>
<style>
:root{--bg:#FFFFFF;--tx:#2A2D31;--mut:#6B6B6B;--dim:#9A9A9A;--btn-bg:#111111;--btn-tx:#FFFFFF}
:root[data-theme=dark]{--bg:#1B1B1B;--tx:#F2F2F2;--mut:#B4B4B4;--dim:#8A8A8A;--btn-bg:#FFFFFF;--btn-tx:#111111}
html,body{height:100%;margin:0}
body{
  display:grid;place-items:center;
  font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--tx);
  overflow:hidden;user-select:none;-webkit-user-select:none;
}
main{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px}
.cloud{width:104px;height:104px;margin-bottom:20px}
.cloud .outline{stroke:var(--tx);transition:stroke .3s}
.cloud .arc{stroke:#0A84FF}
body.error .cloud .outline{stroke:#D23B3B}
body.error .cloud .arc{display:none}
.arc-anim{stroke-dasharray:18 130;animation:arc-run 2.2s linear infinite}
@keyframes arc-run{from{stroke-dashoffset:-148}to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.arc-anim{animation:none}}
h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:0 0 10px}
h1 .kanji{font-size:23px;font-weight:500;opacity:.5;margin-left:10px}
#status{color:var(--mut);margin:0;min-height:1.5em;overflow-wrap:anywhere;max-width:78vw}
#long{color:var(--dim);font-size:13px;margin:8px 0 0;opacity:0;transition:opacity .6s}
#long.on{opacity:1}
#retry{
  display:none;margin-top:26px;padding:11px 26px;border:0;border-radius:12px;cursor:pointer;
  background:var(--btn-bg);color:var(--btn-tx);
  font-size:15px;font-weight:600;
}
#retry:active{opacity:.8}
body.error #retry{display:inline-block}
</style>
</head>
<body>
<main>
  <svg class="cloud" viewBox="0 0 48 48" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path class="outline" d="M24 8c-5 0-9.3 3.2-10.8 7.8A8.5 8.5 0 0 0 6 24a8.5 8.5 0 0 0 8.5 8.5h19A8.5 8.5 0 0 0 42 24a8.5 8.5 0 0 0-6.6-8.3C33.8 11 29.3 8 24 8Z"/>
    <path class="arc arc-anim" pathLength="148" d="M24 8c-5 0-9.3 3.2-10.8 7.8A8.5 8.5 0 0 0 6 24a8.5 8.5 0 0 0 8.5 8.5h19A8.5 8.5 0 0 0 42 24a8.5 8.5 0 0 0-6.6-8.3C33.8 11 29.3 8 24 8Z" stroke="#0A84FF" stroke-width="2.4"/>
    <path class="outline" d="m19 19.5-4 4.5 4 4.5" stroke-width="2"/>
    <path class="outline" d="m29 19.5 4 4.5-4 4.5" stroke-width="2"/>
  </svg>
  <h1>kumo<span class="kanji">雲</span></h1>
  <p id="status">Starting…</p>
  <p id="long">Занимает дольше обычного</p>
  <button id="retry" type="button">Повторить</button>
</main>
<script>
/* Theme arrives via ?theme= from the app (the user's chosen theme), falling back to the system. */
const themeParam=new URLSearchParams(location.search).get('theme');
document.documentElement.dataset.theme=themeParam==='dark'||themeParam==='light'?themeParam:
  (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
const body=document.body,statusEl=document.getElementById('status'),
      longEl=document.getElementById('long'),retryEl=document.getElementById('retry');
let longTimer=null,active=true;
function clearLong(){if(longTimer){clearTimeout(longTimer);longTimer=null}longEl.classList.remove('on')}
function armLong(){clearLong();longTimer=setTimeout(()=>{if(active)longEl.classList.add('on')},10000)}
window.__splashState=function(text){
  active=true;body.classList.remove('error');
  statusEl.textContent=String(text||'Starting…');
  armLong();
};
window.__splashError=function(reason){
  active=false;clearLong();body.classList.add('error');
  statusEl.textContent=String(reason||'Startup failed');
};
retryEl.onclick=()=>{if(window.CodexSplash)CodexSplash.retry()};
armLong();
</script>
</body>
</html>
