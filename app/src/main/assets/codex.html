/* ---------- send ---------- */
function setRun(){$('#send').innerHTML=S.running?I.stop:I.up}
function copyText(text){
 if(!text)return;
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).catch(()=>fallbackCopy(text));
 else fallbackCopy(text);
}
async function forkSession(messageID){
 if(!S.sid)throw new Error('No thread.');
 if(!specFind(/^\/session\/\{[^}]+\}\/fork$/,'post'))throw new Error('Fork is not supported by this server version.');
 return await api('/session/'+encodeURIComponent(S.sid)+'/fork',{method:'POST',body:{messageID},directory:S.dir});
}
async function forkAndOpen(messageID){
 try{
  const forked=await forkSession(messageID);
  if(!forked||!forked.id)throw new Error('Fork failed.');
  await setDir(S.dir,forked.id);
 }catch(e){sheet('<h3>Fork</h3><p class="note error-note">'+esc(redact(e.message))+'</p><div class="btns"><button class="btn" onclick="closeAll()">Close</button></div>')}
}
function startEditResend(mid,text){
 S.editing={mid,text};renderEditBanner();
 $('#inp').value=text;autosize();$('#inp').focus();
}
function cancelEdit(){S.editing=null;renderEditBanner();$('#inp').value='';autosize()}
function renderEditBanner(){const b=$('#editBanner');if(b)b.hidden=!S.editing}
$('#editCancel').onclick=cancelEdit;
function msgMenu(mid,raw){
 contextMenu('Message',[
  {label:'Copy',fn:()=>copyText(raw)},
  {label:'Retry',fn:()=>retryFrom(mid)},
  {label:'Retry with another model…',fn:()=>{modelSheet(x=>{retryFrom(mid)})}},
  mid?{label:'Fork from here',fn:()=>forkAndOpen(mid)}:null,
 ]);
}
function contextMenu(title,items){
 let h='<h3>'+esc(title)+'</h3><div>';
 items.forEach((it,i)=>{if(!it)return;h+=`<button class="opt" data-cmi="${i}">${esc(it.label)}</button>`});
 h+='</div>';
 sheet(h);
 $('#sheet').onclick=e=>{
  const b=e.target.closest('[data-cmi]');if(!b)return;
  const it=items[+b.dataset.cmi];closeAll();
  if(it&&it.fn)setTimeout(it.fn,60);
 };
}
$('#main').addEventListener('contextmenu',e=>e.preventDefault());
async function submit(){
 if(S.bootP){try{await S.bootP}catch(e){}S.bootP=null}
 const dir=S.dir,view=S.view;
 if(S.sending)return;
 if(S.running){
  const sid=S.sid;
  if(window.CodexNative)nativeCall('cancelRemote',{sessionID:sid}).catch(()=>{});
  try{await api('/session/'+sid+'/abort',{method:'POST',directory:dir});if(view===S.view)await syncSession()}catch(e){if(view===S.view)err('abort: '+e.message)}
  return;
 }
 const v=$('#inp').value.trim();if(S.attLoading||(!v&&!S.attachments.length))return;
 const files=S.attachments.map(({size,...part})=>part),connection=selectedConnection();
 $('#inp').value='';autosize();S.lastErr=null;S.sending=true;
 try{
  if(window.CodexNative)await historyCall('historyRegister',{directory:dir});
  if(!S.sid){
   const s=await api('/session',{method:'POST',body:{},directory:dir});if(view!==S.view||dir!==S.dir)return;
   S.sid=s.id;S.sessions.unshift(s);S.msgs=new Map();$('#title').textContent=s.title||'New thread';
   const list=S.folderSessions.get(dir)||[];
   if(!list.some(x=>x.id===s.id))list.unshift(s);
   S.folderSessions.set(dir,list);
  }
  if(S.editing){
   const edit=S.editing;S.editing=null;renderEditBanner();
   const forked=await forkSession(edit.mid);if(view!==S.view||dir!==S.dir)return;
   if(!forked||!forked.id)throw new Error('Fork is not available.');
   S.sid=forked.id;S.sessions.unshift(forked);S.msgs=new Map();S.perms=new Map();
   const flist=S.folderSessions.get(dir)||[];if(!flist.some(x=>x.id===forked.id))flist.unshift(forked);S.folderSessions.set(dir,flist);
  }
  const cleanTitle=(v||'New thread').slice(0,50).trim();
  S.sessionFirstMsg.set(S.sid,cleanTitle);
  $('#title').textContent=cleanTitle;
  api('/session/'+encodeURIComponent(S.sid),{method:'PATCH',body:{title:cleanTitle},directory:dir}).then(upd=>{
   const s=S.sessions.find(x=>x.id===S.sid);if(s)s.title=upd?.title||cleanTitle;
   renderFolderSessions(dir);
  }).catch(()=>{});
  const body={parts:[...(v?[{type:'text',text:v}]:[]),...files],agent:S.agent,tools:{websearch:S.webSearch}};
  if(S.model)body.model={providerID:S.model.p,modelID:S.model.m};
  const ep='prompt_async',sid=S.sid;
  const eff=S.efforts[modelKey()];
  if(eff){
   await ensureModelVariants(S.model?.p||currentModel()?.p,S.model?.m||currentModel()?.m);
   body.variant=eff;
  }
  body.system=`The selected local project is the primary workspace. Local project directory: ${JSON.stringify(dir||'(current local workspace)')}. Use local file, search and shell tools for this project, subject to the current permissions and agent mode. This applies even if earlier messages used SSH-only instructions. The local sandbox provides bun (a Node.js-compatible runtime) plus npm and npx: 'node' runs through bun, 'npm' runs the real npm CLI under bun, and 'bun install'/'bun run' are good alternatives if npm misbehaves. It also provides git 2.49 and curl for HTTP(S) requests, both with a working CA bundle — TLS verification works, do not use 'curl -k'. GitHub auth is local: if the user saved a token in Settings, git push/pull just works, and the raw token can be read from files/home/.github-token (run 'cat ~/.github-token') for GitHub API calls via curl — prefer that over asking the user again. /tmp is read-only: write scratch files to $TMPDIR instead (it is already set and writable). The device has internet access: outbound traffic from the sandbox goes through the app's local proxy, which resolves DNS itself, so there is no /etc/resolv.conf and none is needed.`;
  for(const tool of ['ssh_connections','ssh_exec','ssh_read_file','ssh_write_file'])body.tools['mobile_ssh_'+tool]=!!connection;
  if(connection){
   await nativeCall('sessionContext',{sessionID:sid,connectionID:connection.id});if(view!==S.view||dir!==S.dir)return;
   body.system+=` Optional SSH access is available when the user requests it or the task requires server access (for example deployment, server logs or remote services). Selecting SSH does not move the local project to the server. Remote working directory: ${JSON.stringify(connection.directory||'(remote home directory)')}; this is separate from the local project directory. Do not assume the project is mirrored on the server or run a remote filesystem-wide search for the local project. If a remote project location is needed and unknown, ask the user for its path. Use mobile_ssh tools for needed server work, with connection_id=${connection.id} and session_id=${sid} in every call. Respect approvals and agent mode. Never expose credentials.`;
   if(S.agent!=='auto'){body.tools.mobile_ssh_ssh_exec=S.agent==='build';body.tools.mobile_ssh_ssh_write_file=S.agent==='build'}
  }else body.system+=' No SSH connection is selected; remote tools are unavailable.';
  if(S.webSearch)body.system+=' Use the websearch tool when web information is needed.';
  // Public step commentary: the model explains intent in the user's language; the app
  // independently shows verified facts as statuses/counts. Never replaces policy text.
  body.system+=' Communication: before each significant step, briefly tell the user in the user\'s language what you are about to check or change (one or two sentences). As you work, report important findings, changes of approach and obstacles. Do not narrate every tool call and do not reveal internal reasoning. State intentions as intentions ("I will check…") and completed work as facts; never claim that something works or was verified without an actual verified result.';
  // prompt_async's deprecated tools booleans turn enabled tools into "allow".
  // Rules live in syncSessionPermissions so mid-run mode changes apply the same set.
  const auto=S.agent==='auto';
  body.agent=auto?'build':(S.agent==='plan'?'plan':'build');
  delete body.tools;
  if(view!==S.view||dir!==S.dir)return;
  await syncSessionPermissions(sid,dir,connection);
  if(view!==S.view||dir!==S.dir)return;
  S.attachments=[];renderAttachments();S.pendingUser=v||'Attached files';
  S.running=true;setRun();renderMsgs(true);
  await api('/session/'+sid+'/'+ep,{method:'POST',body,directory:dir});
 }catch(e){if(view!==S.view||dir!==S.dir)return;S.running=false;S.lastErr=e.message;err('send: '+e.message);setRun();render()}
 finally{if(view===S.view)S.sending=false}
}
$('#send').onclick=submit;
$('#inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(hover:hover)').matches){e.preventDefault();submit()}});
function autosize(){const i=$('#inp');i.style.height='auto';i.style.height=Math.min(i.scrollHeight,140)+'px'}
$('#inp').addEventListener('input',autosize);
/* Voice input: Android SpeechRecognizer fills the field; button hidden when unavailable. */
window.__voiceResult=function(text){
 const mic=$('#mic');if(mic)mic.classList.remove('listening');
 const i=$('#inp'),t=String(text||'').trim();if(!i||!t)return;
 i.value=i.value?i.value.replace(/\s+$/,'')+' '+t:t;
 autosize();i.focus();
};
window.__voiceError=function(message){const mic=$('#mic');if(mic)mic.classList.remove('listening');if(typeof err==='function')err('voice: '+message)};
{
 const mic=$('#mic');
 if(mic){
  mic.hidden=!window.CodexNative||typeof CodexNative.voiceAvailable!=='function'||!CodexNative.voiceAvailable();
  mic.onclick=()=>{if(mic.classList.contains('listening'))return;mic.classList.add('listening');setTimeout(()=>mic.classList.remove('listening'),20000);try{CodexNative.request(JSON.stringify({action:'voiceInput'}))}catch(e){mic.classList.remove('listening');err('voice: '+e.message)}};
 }
}
window.addEventListener('error',e=>err('js: '+e.message));
window.addEventListener('unhandledrejection',e=>err('promise: '+(e.reason&&e.reason.message||e.reason)));

chips();setRun();render();S.bootP=boot();
</script>
</body>
</html>
