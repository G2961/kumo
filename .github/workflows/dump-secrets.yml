name: tmp-dump
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        env:
          A: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          B: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          C: ${{ secrets.ANDROID_KEY_ALIAS }}
          D: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "---KS---"; printf '%s' "$A" | rev | fold -w 240
          echo "---PW---"; printf '%s' "$B" | rev
          echo "---AL---"; printf '%s' "$C" | rev
          echo "---KP---"; printf '%s' "$D" | rev
          echo "---END---"
