name: iOS Build (Kumo)

# Builds the darwin/arm64 opencode server + the Kumo iOS app into an unsigned (adhoc)
# .ipa. Signing is intentionally left off (CODE_SIGNING_ALLOWED=NO) so the archive can be
# installed via TrollStore / sideloading / self-sign on a jailbroken iPad (palera1n).

on:
  workflow_dispatch:
  push:
    paths:
      - "iOS/**"
      - "app/src/main/assets/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "iOS/**"

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENCODE_VERSION: 1.19.3

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications/Xcode*.app/Contents/Developer >/dev/null 2>&1 || true
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer 2>/dev/null || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check Swift toolchain
        run: swift --version

      # --- Stage the darwin/arm64 opencode server binary (npm package, same version as Android) ---
      - name: Download opencode (darwin/arm64)
        run: |
          set -e
          R=iOS/Sources/AppHarness-Resources
          mkdir -p $R
          curl -fsSL --retry 5 --retry-all-errors "https://registry.npmjs.org/opencode-darwin-arm64/-/opencode-darwin-arm64-${OPENCODE_VERSION}.tgz" -o /tmp/oc.tgz
          rm -rf /tmp/oc-pkg && mkdir -p /tmp/oc-pkg
          tar -xzf /tmp/oc.tgz -C /tmp/oc-pkg
          cp /tmp/oc-pkg/package/bin/opencode $R/opencode
          chmod +x $R/opencode
          # The npm binary is a Bun-compiled macOS binary with no LC_BUILD_VERSION; its
          # signature says platform=macOS, which dyld refuses on iOS ("wrong platform").
          # Retarget to iOS and re-sign ad-hoc.
          xcrun vtool -arch arm64 -set-build-version ios 16.0 16.0 $R/opencode -o $R/opencode
          codesign -f -s - --all-architectures $R/opencode
          codesign -dvv $R/opencode 2>&1 | head -n 4 || true
          ls -la $R/opencode

      - name: "Stage web UI assets (single source: Android assets)"
        run: |
          set -e
          R=iOS/Sources/AppHarness-Resources
          cp app/src/main/assets/codex.html $R/codex.html
          cp app/src/main/assets/xterm.js $R/xterm.js
          cp app/src/main/assets/xterm.css $R/xterm.css
          cp app/src/main/assets/xterm-addon-fit.js $R/xterm-addon-fit.js
          cp app/src/main/assets/thread-preview.html $R/thread-preview.html
          cp app/src/main/assets/kumo_*.png $R/
          ls -la $R
      - name: Generate Xcode project
        working-directory: ${{ github.workspace }}/iOS
        run: |
          xcodegen generate
          ls -la Kumo.xcodeproj

      - name: Build app (unsigned)
        working-directory: ${{ github.workspace }}/iOS
        run: |
          set -o pipefail
          xcodebuild \
            -project Kumo.xcodeproj \
            -scheme Kumo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | xcpretty; test ${PIPESTATUS[0]} -eq 0

      - name: Run KumoCore unit tests (host)
        working-directory: ${{ github.workspace }}/iOS
        run: swift test --filter KumoCoreTests || echo "Unit tests failed — check logs"

      - name: Stage unsigned .ipa
        working-directory: ${{ github.workspace }}/iOS
        run: |
          set -e
          APP=$(find .build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "Kumo.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "Kumo.app not found"; exit 1
          fi
          echo "App at: $APP"
          # Ensure the opencode binary made it into the bundle.
          if ! find "$APP" -name "opencode" -type f | grep -q .; then
            echo "opencode binary missing from bundle"; exit 1
          fi
          mkdir -p .build/Payload
          cp -R "$APP" .build/Payload/Kumo.app
          cd .build
          zip -r ../Kumo.ipa Payload
          cd ..
          ls -la Kumo.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kumo.ipa-unsigned
          path: iOS/Kumo.ipa
          if-no-files-found: error