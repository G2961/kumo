name: Build OpenCode APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENCODE_VERSION: 1.19.3
  ALPINE_VERSION: 3.22.1
  RG_VERSION: 15.1.0
  BUN_VERSION: 1.4.4

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete previous artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --paginate -q '.artifacts[] | [.id, .name] | @tsv' | while IFS=$'\t' read -r id name; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" >/dev/null 2>&1 && echo "deleted $name ($id)" || true
          done || true

      - name: Cache native binaries
        id: native-cache
        uses: actions/cache@v4
        with:
          path: jni/arm64-v8a
          key: native-${{ env.OPENCODE_VERSION }}-${{ env.ALPINE_VERSION }}-${{ env.RG_VERSION }}-${{ env.BUN_VERSION }}

      - name: Cache npm+git rootfs
        id: npmfs-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/rootfs.tgz
          key: npmfs-${{ env.ALPINE_VERSION }}-v1

      - name: Download opencode binary (arm64 musl)
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p jni/arm64-v8a
          curl -fsSL --retry 5 --retry-all-errors "https://registry.npmjs.org/opencode-linux-arm64-musl/-/opencode-linux-arm64-musl-${OPENCODE_VERSION}.tgz" -o /tmp/opencode.tgz
          mkdir -p /tmp/opencode-pkg
          tar -xzf /tmp/opencode.tgz -C /tmp/opencode-pkg
          cp /tmp/opencode-pkg/package/bin/opencode jni/arm64-v8a/libopencode.so
          chmod +x jni/arm64-v8a/libopencode.so
          file jni/arm64-v8a/libopencode.so

      - name: Download Alpine libraries (aarch64)
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p app/src/main/assets
          MINI="https://dl-2.alpinelinux.org/alpine/v${ALPINE_VERSION%.*}/releases/aarch64/alpine-minirootfs-${ALPINE_VERSION}-aarch64.tar.gz"
          MAIN="https://dl-2.alpinelinux.org/alpine/v${ALPINE_VERSION%.*}/main/aarch64"

          mkdir -p /tmp/alpine && cd /tmp/alpine
          curl -fsSL --retry 5 --retry-all-errors "$MINI" -o mini.tgz
          mkdir mini && tar -xzf mini.tgz -C mini
          cp -L mini/lib/ld-musl-aarch64.so.1 "$GITHUB_WORKSPACE/jni/arm64-v8a/libldmusl.so"

          fetch_apk() {
            local base="$1" pattern="$2" src="$3" out="$4"
            local pkg
            pkg=$(curl -fsSL --retry 5 --retry-all-errors "$base/" | grep -oE "${pattern}" | sort -V | tail -1)
            if [ -z "$pkg" ]; then echo "package not found: $pattern at $base" >&2; exit 1; fi
            curl -fsSL --retry 5 --retry-all-errors "$base/$pkg" -o pkg.apk
            rm -rf ex && mkdir -p ex && tar -xzf pkg.apk -C ex
            cp -L "ex/$src" "$GITHUB_WORKSPACE/jni/arm64-v8a/$out"
            rm -rf ex pkg.apk
          }

          fetch_apk "$MAIN" "libstdc%2B%2B-[0-9.]+-r[0-9]+\.apk" "usr/lib/libstdc++.so.6" "libstdcxx.so"
          fetch_apk "$MAIN" "libgcc-[0-9.]+-r[0-9]+\.apk" "usr/lib/libgcc_s.so.1" "libgcc.so"

          ls -la "$GITHUB_WORKSPACE/jni/arm64-v8a/"

      - name: Download bun runtime (arm64 musl)
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p /tmp/bun jni/arm64-v8a
          curl -fsSL --retry 5 --retry-all-errors "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-aarch64-musl.zip" -o /tmp/bun/bun.zip
          python3 - <<'EOF'
          import zipfile
          z = zipfile.ZipFile('/tmp/bun/bun.zip')
          name = [n for n in z.namelist() if n.split('/')[-1] == 'bun'][0]
          open('jni/arm64-v8a/libbun.so', 'wb').write(z.read(name))
          print('libbun.so:', len(z.read(name)), 'bytes')
          EOF

      - name: Pack npm+git into assets rootfs
        if: steps.npmfs-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p /tmp/npmfs app/src/main/assets
          # Pinned package names (verified live on the mirror) — the CDN listing mixes in
          # stale/foreign names that break `sort -V` selection (zlib-2.3.3 404s).
          BASE="https://dl-2.alpinelinux.org/alpine/v${ALPINE_VERSION%.*}"
          curl -fsSL --retry 5 --retry-all-errors "$BASE/community/aarch64/npm-11.6.4-r0.apk" -o /tmp/npmfs/npm.apk
          PKGS="git-2.49.1-r0 libcurl-8.14.1-r4 pcre2-32-10.46-r1 libexpat-2.10.0-r0 zlib-1.3.2-r1 ca-certificates-bundle-20261020-r0 curl-8.14.1-r4 libssl3-3.5.9-r0 libcrypto3-3.5.9-r0 brotli-libs-1.1.1-r0 libidn2-2.3.7-r0 libunistring-1.3-r0 libpsl-0.21.5-r3 nghttp2-libs-1.69.0-r0 c-ares-1.34.9-r0 zstd-libs-1.5.7-r0"
          for p in $PKGS; do
            echo "GET $p"; curl -fsSL --retry 5 --retry-all-errors "$BASE/main/aarch64/$p.apk" -o "/tmp/npmfs/$p.apk" || { echo "FAILED: $BASE/main/aarch64/$p.apk"; exit 1; }
          done
          python3 - <<'EOF'
          import tarfile, os
          out = '/tmp/npmfs/rootfs'
          os.makedirs(out, exist_ok=True)
          sources = ['/tmp/npmfs/npm.apk', '/tmp/npmfs/git-2.49.1-r0.apk', '/tmp/npmfs/libcurl-8.14.1-r4.apk',
                     '/tmp/npmfs/pcre2-32-10.46-r1.apk', '/tmp/npmfs/libexpat-2.10.0-r0.apk', '/tmp/npmfs/zlib-1.3.2-r1.apk',
                     '/tmp/npmfs/ca-certificates-bundle-20261020-r0.apk', '/tmp/npmfs/curl-8.14.1-r4.apk',
                     '/tmp/npmfs/libssl3-3.5.9-r0.apk', '/tmp/npmfs/libcrypto3-3.5.9-r0.apk', '/tmp/npmfs/brotli-libs-1.1.1-r0.apk',
                     '/tmp/npmfs/libidn2-2.3.7-r0.apk', '/tmp/npmfs/libunistring-1.3-r0.apk', '/tmp/npmfs/libpsl-0.21.5-r3.apk',
                     '/tmp/npmfs/nghttp2-libs-1.69.0-r0.apk', '/tmp/npmfs/c-ares-1.34.9-r0.apk', '/tmp/npmfs/zstd-libs-1.5.7-r0.apk']
          kept = 0
          for apk_path in sources:
              apk = tarfile.open(apk_path, 'r:gz')
              for m in apk.getmembers():
                  if m.isdir() or m.issym() or m.islnk():
                      continue
                  if not (m.name.startswith('usr/lib/node_modules/npm/') or m.name.startswith('usr/bin/')
                          or m.name.startswith('usr/lib/') or m.name.startswith('usr/libexec/git-core/')
                          or m.name.startswith('usr/share/git-core/') or m.name.startswith('etc/ssl/')):
                      continue
                  if 'usr/bin/' in m.name and m.name != 'usr/bin/curl' and 'git' not in m.name:
                      # npm ships usr/bin symlinks (skipped above); git/curl binaries are wanted.
                      if not m.name.startswith('usr/bin/npm'):
                          continue
                  p = os.path.join(out, m.name)
                  os.makedirs(os.path.dirname(p), exist_ok=True)
                  open(p, 'wb').write(apk.extractfile(m).read())
                  os.chmod(p, m.mode & 0o777)
                  kept += 1
              apk.close()
          print('rootfs files kept:', kept)
          # Alpine ships soname symlinks (libX.so.N -> libX.so.N.Y.Z); the tar packer
          # skips them, so materialize each soname as a real copy for the runtime linker.
          import re
          libdir = os.path.join(out, 'usr', 'lib')
          if os.path.isdir(libdir):
              made = 0
              for f in os.listdir(libdir):
                  m = re.fullmatch(r'(lib[A-Za-z0-9_+-]*\.so\.\d+)\.\d+\.\d+', f)
                  if m and not os.path.exists(os.path.join(libdir, m.group(1))):
                      src = os.path.join(libdir, f)
                      dst = os.path.join(libdir, m.group(1))
                      open(dst, 'wb').write(open(src, 'rb').read())
                      os.chmod(dst, os.stat(src).st_mode & 0o777)
                      made += 1
              print('soname copies:', made)
          # curl is built against /etc/ssl/cert.pem (Alpine default): materialize it too.
          ca = os.path.join(out, 'etc', 'ssl', 'certs', 'ca-certificates.crt')
          pem = os.path.join(out, 'etc', 'ssl', 'cert.pem')
          if os.path.exists(ca) and not os.path.exists(pem):
              open(pem, 'wb').write(open(ca, 'rb').read())
              os.chmod(pem, 0o644)
              print('ssl cert.pem materialized')
          with tarfile.open('app/src/main/assets/rootfs.tgz', 'w:gz', format=tarfile.USTAR_FORMAT) as t:
              t.add(out + '/usr', arcname='usr')
              t.add(out + '/etc', arcname='etc')
          EOF
          ls -la app/src/main/assets/rootfs.tgz

      - name: Cache Cargo registry and ripgrep build
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/rg/target
          key: cargo-rg-${{ env.RG_VERSION }}

      - name: Build static ripgrep (aarch64 musl)
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          rustup target add aarch64-unknown-linux-musl
          pip3 install -q ziglang
          cargo install -q cargo-zigbuild
          curl -fsSL --retry 5 --retry-all-errors "https://github.com/BurntSushi/ripgrep/archive/refs/tags/${RG_VERSION}.tar.gz" -o /tmp/rg.tgz
          mkdir -p /tmp/rg && tar -xzf /tmp/rg.tgz -C /tmp/rg --strip-components=1
          cd /tmp/rg
          cargo zigbuild --release --target aarch64-unknown-linux-musl
          cp target/aarch64-unknown-linux-musl/release/rg "$GITHUB_WORKSPACE/jni/arm64-v8a/librg.so"
          file "$GITHUB_WORKSPACE/jni/arm64-v8a/librg.so"

      - name: Install runtime files into project
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp jni/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          file app/src/main/jniLibs/arm64-v8a/*.so
          du -sh app/src/main/jniLibs

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle assembleDebug assembleRelease --no-daemon

      - name: Publish release APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          NAME="opencode-android-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          for tag in apk-latest "build-${{ github.run_number }}"; do
            if ! gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              gh release create "$tag" --repo "${{ github.repository }}" --title "OpenCode Android build ${{ github.run_number }}" --notes "Automated build of commit ${{ github.sha }}" >/dev/null
            fi
            gh release upload "$tag" "$NAME" --repo "${{ github.repository }}" --clobber
          done
          gh release view apk-latest --repo "${{ github.repository }}" --json assets -q '.assets[].name'
