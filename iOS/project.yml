name: Kumo
options:
  bundleIdPrefix: space.g2961
  deploymentTarget:
    iOS: "16.0"
targets:
  Kumo:
    type: application
    platform: iOS
    sources:
      - path: Sources/KumoApp
      - path: Sources/KumoCore
      - path: AppHarness
      - path: Sources/AppHarness-Resources
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.g2961.kumo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kumo
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Kumo records audio only when you use voice input
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        OTHER_LDFLAGS: $(inherited) -framework Security -framework Network
        CODE_SIGN_STYLE: Automatic
schemes:
  Kumo:
    build:
      targets:
        Kumo: all
    run:
      config: Debug